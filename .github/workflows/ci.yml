name: CI Pipeline

on:
  push:
    branches: [ main, master, feat/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests & Linting
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: smart_support_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Dependencies
        run: uv sync --frozen || uv sync

      - name: Seed Test Database
        env:
          DATABASE_URL: "postgresql://postgres:postgres_password@localhost:5432/smart_support_db"
          OPENROUTER_API_KEY: "mock_key_for_ci"
        run: |
          uv run python -m scripts.seed_golden_examples || true

      - name: Run Tests
        env:
          DATABASE_URL: "postgresql://postgres:postgres_password@localhost:5432/smart_support_db"
          GROQ_API_KEY: "mock_key_for_ci"
          OPENROUTER_API_KEY: "mock_key_for_ci"
        run: |
          uv run pytest -v
