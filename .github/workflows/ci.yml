name: CI Pipeline

on:
  push:
    branches: [ main, master, feat/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Dependencies
        run: uv sync --frozen || uv sync

      - name: Run Tests
        env:
          GROQ_API_KEY: "mock_key_for_ci"
          OPENROUTER_API_KEY: "mock_key_for_ci"
        run: |
          uv run pytest -v -m "not integration" || uv run pytest -v
